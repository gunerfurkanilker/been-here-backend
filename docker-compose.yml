services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: been_here_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-beenhere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beenhere_secret}
      POSTGRES_DB: ${DB_NAME:-been_here_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - been_here_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-beenhere} -d ${DB_NAME:-been_here_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: been_here_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - been_here_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: been_here_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@beenhere.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - been_here_pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  been_here_pgdata:
  been_here_redisdata:
  been_here_pgadmindata:
